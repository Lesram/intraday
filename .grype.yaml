# Grype Configuration
# SBOM (Software Bill of Materials) Vulnerability Scanner

# Only scan production code
only:
  - python

# Fail build on these severities
fail-on-severity: critical

# Ignore list
ignore:
  # ==============================================================================
  # CVE-2022-37434: zlib heap-based buffer overflow
  # CVE-2023-45853: zlib integer overflow
  # ==============================================================================
  # Finding: zlib@1.2.11 has 2 CRITICAL vulnerabilities
  # 
  # Context: zlib is a system-level dependency (not directly in requirements.txt)
  #          Likely pulled in by numpy, pillow, or other C-extension packages
  # 
  # Risk: MEDIUM
  #   - Requires specially crafted compressed data
  #   - We don't process untrusted compressed files
  #   - Python's built-in zlib module wraps system zlib
  # 
  # Mitigation Options:
  #   1. Update system zlib to 1.3.1+ (OS-level update)
  #   2. Rebuild Python with updated zlib
  #   3. Update numpy/pillow to versions built against zlib 1.3.1+
  # 
  # Status: ACCEPTED WITH MONITORING
  #   - Not directly exploitable in our use case
  #   - Requires OS-level update (Windows/Linux)
  #   - Will monitor for updates in next maintenance window
  # 
  # Tracking: Issue #XXX - Update system dependencies
  # ==============================================================================
  
  - vulnerability: CVE-2022-37434
    fix-state: wont-fix
    package:
      name: zlib
      version: "1.2.11"
    reason: "System-level dependency, requires OS update. Low exploitability in our context (no untrusted compressed file processing). Will update in next maintenance window."
  
  - vulnerability: CVE-2023-45853
    fix-state: wont-fix
    package:
      name: zlib
      version: "1.2.11"
    reason: "System-level dependency, requires OS update. Low exploitability in our context (no untrusted compressed file processing). Will update in next maintenance window."

# Match configuration
match:
  java:
    using-cpes: false
  python:
    using-cpes: true

# Output configuration
output:
  # Show only high and critical
  quiet: false
  
# Database updates
db:
  auto-update: true
  cache-dir: ".grype/db"
  update-available-timeout: 60s
  max-allowed-built-age: 120h

# Scope
scope: all-layers
