# =============================================================================
# Production Docker Compose Configuration
# =============================================================================
# Complete production stack with:
# - Application service with health checks
# - PostgreSQL database with persistence
# - Redis for caching
# - Prometheus for metrics
# - Nginx reverse proxy
# =============================================================================

services:
  # ---------------------------------------------------------------------------
  # Application Server
  # ---------------------------------------------------------------------------
  app:
    build:
      context: .
      dockerfile: Dockerfile.production
      target: production
    image: algotrading-platform:${APP_VERSION:-latest}
    container_name: algotrading-app
    restart: unless-stopped
    
    # Environment configuration
    # Audit-L finding L-1 (2026-05-02): production compose previously had
    # ZERO ORGANISM_* env wiring + used JWT_SECRET (not read by code).
    # Code reads SECURITY_JWT_SECRET (per backend/infra/security.py:382).
    # Audit-L finding L-7 (2026-05-02): unified to canonical SECURITY_JWT_SECRET.
    environment:
      - APP_ENVIRONMENT=production
      - APP_VERSION=${APP_VERSION:-1.0.0}
      - DATABASE_URL=postgresql+asyncpg://${DB_USER:-algo}:${DB_PASSWORD}@postgres:5432/${DB_NAME:-algotrading}
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379/0
      # JWT — canonical name per code (was JWT_SECRET, not read by code)
      - SECURITY_JWT_SECRET=${SECURITY_JWT_SECRET:?SECURITY_JWT_SECRET is required for production}
      - JWT_SECRET_KEY=${SECURITY_JWT_SECRET}
      # Alpaca — production uses different env var names than the SDK
      - ALPACA_API_KEY_ID=${ALPACA_API_KEY_ID:-${ALPACA_API_KEY}}
      - ALPACA_API_SECRET_KEY=${ALPACA_API_SECRET_KEY:-${ALPACA_SECRET_KEY}}
      - ALPACA_BASE_URL=${ALPACA_BASE_URL:-https://api.alpaca.markets}
      - ALPACA_DATA_URL=${ALPACA_DATA_URL:-https://data.alpaca.markets/v2}
      - ALPACA_STREAM_URL=${ALPACA_STREAM_URL:-wss://api.alpaca.markets/stream}
      - ALPACA_PAPER=${ALPACA_PAPER:-false}
      - ALPACA_DATA_FEED=${ALPACA_DATA_FEED:-sip}
      # Organism config — DO NOT rely on bare code defaults in production
      - ORGANISM_ENABLED=${ORGANISM_ENABLED:-1}
      - ENABLE_ORGANISM_SCHEDULER=${ENABLE_ORGANISM_SCHEDULER:-1}
      - ORGANISM_LIVE_TIMEFRAME=${ORGANISM_LIVE_TIMEFRAME:-1Min}
      - ORGANISM_TICK_INTERVAL_SECONDS=${ORGANISM_TICK_INTERVAL_SECONDS:-10}
      - ORGANISM_LIVE_SYMBOLS=${ORGANISM_LIVE_SYMBOLS}
      - ORGANISM_LIVE_LOOKBACK=${ORGANISM_LIVE_LOOKBACK:-500}
      - ORGANISM_MIN_BARS=${ORGANISM_MIN_BARS:-50}
      - ORGANISM_MAX_POSITIONS=${ORGANISM_MAX_POSITIONS:-2}
      - ORGANISM_ALPHA_TOP_N=${ORGANISM_ALPHA_TOP_N:-3}
      - ORGANISM_LONG_ONLY=${ORGANISM_LONG_ONLY:-true}
      - ORGANISM_RETRAIN_INTERVAL=${ORGANISM_RETRAIN_INTERVAL:-180}
      - ORGANISM_FREEZE_ADAPTATION=${ORGANISM_FREEZE_ADAPTATION:-0}
      - ORGANISM_USE_STREAMING=${ORGANISM_USE_STREAMING:-1}
      - ORGANISM_TRAIN_WINDOW=${ORGANISM_TRAIN_WINDOW:-100}
      - ORGANISM_DRAWDOWN_COOLDOWN_S=${ORGANISM_DRAWDOWN_COOLDOWN_S:-300}
      - ORGANISM_DRAWDOWN_KILL_PCT=${ORGANISM_DRAWDOWN_KILL_PCT:-0.08}
      - ORGANISM_MAX_DAILY_LOSS=${ORGANISM_MAX_DAILY_LOSS:-50}
      - ORGANISM_MAX_NOTIONAL=${ORGANISM_MAX_NOTIONAL:-200}
      - ORGANISM_DROP_ML_FROM_GATE=${ORGANISM_DROP_ML_FROM_GATE:-true}
      # CORS / logging
      - APP_CORS_ORIGINS=${APP_CORS_ORIGINS:-["https://localhost"]}
      - CORS_ORIGINS=${CORS_ORIGINS:-["https://localhost"]}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - PROMETHEUS_ENABLED=true
    
    # Port mapping
    ports:
      - "${APP_PORT:-8000}:8000"
    
    # Dependencies
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    
    # Health check
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    
    # Resource limits
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2G
        reservations:
          cpus: "0.5"
          memory: 512M
    
    # Volumes for logs
    volumes:
      - app_logs:/app/logs
    
    # Network
    networks:
      - algotrading-network
    
    # Logging configuration
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "5"

  # ---------------------------------------------------------------------------
  # PostgreSQL Database
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: algotrading-postgres
    restart: unless-stopped
    
    environment:
      - POSTGRES_USER=${DB_USER:-algo}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_DB=${DB_NAME:-algotrading}
      - PGDATA=/var/lib/postgresql/data/pgdata
    
    # Port mapping (optional, for debugging)
    ports:
      - "${DB_PORT:-5432}:5432"
    
    # Health check
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-algo} -d ${DB_NAME:-algotrading}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    
    # Persistent storage
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
    
    # Resource limits
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G
        reservations:
          cpus: "0.25"
          memory: 256M
    
    networks:
      - algotrading-network
    
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"

  # ---------------------------------------------------------------------------
  # Redis Cache
  # ---------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: algotrading-redis
    restart: unless-stopped
    
    # Redis configuration
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD}
      --appendonly yes
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
    
    ports:
      - "${REDIS_PORT:-6379}:6379"
    
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
    
    volumes:
      - redis_data:/data
    
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M
    
    networks:
      - algotrading-network
    
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "3"

  # ---------------------------------------------------------------------------
  # Prometheus Metrics (optional)
  # ---------------------------------------------------------------------------
  prometheus:
    image: prom/prometheus:v2.53.0
    container_name: algotrading-prometheus
    restart: unless-stopped
    
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=15d"
      - "--web.enable-lifecycle"
    
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    
    volumes:
      - ./config/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    
    depends_on:
      - app
    
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M
    
    networks:
      - algotrading-network
    
    profiles:
      - monitoring

  # ---------------------------------------------------------------------------
  # Nginx Reverse Proxy (optional)
  # ---------------------------------------------------------------------------
  nginx:
    image: nginx:alpine
    container_name: algotrading-nginx
    restart: unless-stopped
    
    ports:
      - "80:80"
      - "443:443"
    
    volumes:
      - ./config/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./config/ssl:/etc/nginx/ssl:ro
      - nginx_logs:/var/log/nginx
    
    depends_on:
      app:
        condition: service_healthy
    
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
    
    networks:
      - algotrading-network
    
    profiles:
      - proxy

# -----------------------------------------------------------------------------
# Networks
# -----------------------------------------------------------------------------
networks:
  algotrading-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16

# -----------------------------------------------------------------------------
# Volumes
# -----------------------------------------------------------------------------
volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  prometheus_data:
    driver: local
  app_logs:
    driver: local
  nginx_logs:
    driver: local
