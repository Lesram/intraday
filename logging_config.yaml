version: 1
disable_existing_loggers: False

formatters:
  json:
    (): backend.infra.logging.JSONFormatter
    include_context: false

  session_json:
    (): backend.infra.logging.SessionJSONFormatter

  standard:
    format: '%(asctime)s [%(levelname)s] %(name)s: %(message)s'
    datefmt: '%Y-%m-%d %H:%M:%S'

handlers:
  console:
    class: logging.StreamHandler
    level: INFO
    formatter: json
    stream: ext://sys.stdout

  file:
    class: logging.handlers.RotatingFileHandler
    level: INFO
    formatter: json
    filename: /app/logs/application.log
    maxBytes: 52428800  # 50MB
    backupCount: 5
    encoding: utf8

  session:
    class: backend.infra.logging.UTCSessionFileHandler
    level: INFO
    formatter: session_json
    directory: /app/logs/sessions

root:
  level: INFO
  handlers: [console]

loggers:
  uvicorn:
    level: INFO
    handlers: [console]
    propagate: no

  uvicorn.access:
    level: INFO
    handlers: [console]
    propagate: no

  backend:
    level: INFO
    handlers: [console, file, session]
    propagate: no

  audit:
    level: INFO
    handlers: [file]
    propagate: no
