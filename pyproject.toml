[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "algotrading-platform"
version = "1.0.0"
description = "Institutional-grade algorithmic trading platform with AI/ML capabilities"
authors = [
    {name = "Trading Platform Team", email = "dev@trading-platform.com"},
]
readme = "README.md"
requires-python = ">=3.11"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Financial and Insurance Industry",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Topic :: Office/Business :: Financial :: Investment",
    "Typing :: Typed",
]
dependencies = [
    "fastapi>=0.100.0",
    "uvicorn[standard]>=0.23.0",
    "websockets>=10.4",
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "tensorflow>=2.13.0",
    "scikit-learn>=1.3.0",
    "xgboost>=1.7.0",
    "transformers>=4.30.0",
    "torch>=2.0.0",
    "alpaca-py>=0.8.0",
    "yfinance>=0.2.0",
    "tweepy>=4.12.0",
    "praw>=7.6.0",
    "redis>=4.5.0",
    "sqlalchemy>=2.0.0",
    "httpx>=0.24.0",
    "aiohttp>=3.8.0",
    "python-decouple>=3.6",
    "pydantic>=2.0.0",
    "python-jose[cryptography]>=3.3.0",
    "python-multipart>=0.0.6",
    "bcrypt>=4.0.0",
    "passlib[bcrypt]>=1.7.0",
    "prometheus-client>=0.17.0",
    "structlog>=23.0.0",
    "opentelemetry-api>=1.20.0",
    "opentelemetry-sdk>=1.20.0",
    "opentelemetry-exporter-otlp>=1.20.0",
    "opentelemetry-exporter-prometheus>=1.12.0rc1",
    "opentelemetry-instrumentation-fastapi>=0.41b0",
    "opentelemetry-instrumentation-requests>=0.41b0",
    "opentelemetry-instrumentation-sqlalchemy>=0.41b0",
    "opentelemetry-instrumentation-asyncpg>=0.41b0",
    "opentelemetry-semantic-conventions>=0.41b0",
    "python-dateutil>=2.8.0",
    "pytz>=2023.0",
    "joblib>=1.3.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.1.0",
    "mypy>=1.5.0",
    "bandit[toml]>=1.7.0",
    "safety>=2.3.0",
    "pip-audit>=2.6.0",
    "types-python-dateutil",
    "types-requests",
    "types-redis",
    "respx>=0.20.0",
    "aioresponses>=0.7.0",
    "testcontainers>=3.7.0",
]
docs = [
    "mkdocs>=1.5.0",
    "mkdocs-material>=9.0.0",
    "mkdocs-mermaid2-plugin>=1.1.0",
]

[project.urls]
Homepage = "https://github.com/your-org/algotrading-platform"
Documentation = "https://your-org.github.io/algotrading-platform/"
Repository = "https://github.com/your-org/algotrading-platform.git"
"Bug Tracker" = "https://github.com/your-org/algotrading-platform/issues"

# Ruff Configuration
[tool.ruff]
target-version = "py311"
line-length = 100
indent-width = 4

# Enable specific rule categories
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # Pyflakes
    "I",      # isort
    "B",      # flake8-bugbear
    "UP",     # pyupgrade
    "SIM",    # flake8-simplify
    "PTH",    # flake8-use-pathlib
    "PL",     # Pylint
]

# Ignore specific rules
ignore = [
    "E501",     # Line too long (handled by formatter)
    "B008",     # Do not perform function calls in argument defaults
    "C901",     # Too complex (let's handle this case by case)
    "PLR0913",  # Too many arguments
    "PLR0912",  # Too many branches
    "TRY003",   # Avoid specifying long messages outside exception class
    "PERF203",  # try-except in loop (sometimes necessary)
    "UP007",    # Use X | Y for type unions (keep compatibility)
]

# Exclude patterns
exclude = [
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".git-rewrite",
    ".hg",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".pytype",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "venv",
    "alembic/versions/*.py",  # Database migration files
    "scripts/generated/",     # Generated scripts
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.ruff.lint.isort]
known-first-party = ["backend", "tests"]
force-sort-within-sections = true
split-on-trailing-comma = true

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = [
    "S101",     # Use of assert
    "PLR2004",  # Magic value used in comparison
    "S105",     # Possible hardcoded password
    "S106",     # Possible hardcoded password
]
"alembic/versions/*.py" = [
    "E501",     # Line too long
    "F401",     # Unused import
    "F841",     # Unused variable
]
"scripts/**/*.py" = [
    "T201",     # print() statements allowed in scripts
]

# MyPy Configuration
[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
warn_unreachable = true
warn_unused_ignores = true
warn_redundant_casts = true
disallow_untyped_defs = true
disallow_any_generics = true
disallow_subclassing_any = true
disallow_untyped_calls = true
disallow_untyped_decorators = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
show_error_codes = true
show_column_numbers = true
pretty = true

# Configure paths for relative imports
mypy_path = "."
namespace_packages = true
explicit_package_bases = true

# Per-module configuration
[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
disallow_untyped_calls = false
disallow_incomplete_defs = false

[[tool.mypy.overrides]]
module = [
    "alpaca.*",
    "yfinance.*",
    "tweepy.*",
    "praw.*",
    "transformers.*",
    "tensorflow.*",
    "xgboost.*",
    "prometheus_client.*",
    "structlog.*",
    "opentelemetry.*",
]
ignore_missing_imports = true

# Stricter type checking for core backend packages
[[tool.mypy.overrides]]
module = [
    "backend.services.*",
    "backend.risk.*",
    "backend.infra.*"
]
# Extra strict for critical business logic
warn_unused_ignores = true
disallow_any_generics = true
disallow_any_unimported = false  # Relax for now due to import issues
disallow_any_expr = false  # Still allow Any in some contexts
disallow_any_decorated = false  # Allow decorated functions with Any
strict_optional = true
warn_no_return = true
warn_return_any = true
# Temporarily ignore missing imports while we fix them
ignore_missing_imports = false

# Bandit Security Configuration
[tool.bandit]
exclude_dirs = ["tests", "venv", ".venv", "build", "dist"]
skips = [
    "B101",  # assert_used - we use asserts in tests
    "B601",  # paramiko_calls - if we use paramiko, it's intentional
]

# Only report high severity issues
confidence = "HIGH"
severity = "HIGH"

[tool.bandit.assert_used]
skips = ["**/test_*.py", "**/tests/*.py"]
