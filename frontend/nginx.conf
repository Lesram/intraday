map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

# Raw websocket URLs contain authentication query parameters. Log only the
# path and response status, never the query, headers or request body.
log_format operator_ui '$remote_addr $request_method $uri $status';

server {
    # Override the base image's inherited log, which includes query strings.
    access_log /dev/stdout operator_ui;
    error_log /dev/stderr crit;
    listen 8080;
    server_name _;
    server_tokens off;
    root /usr/share/nginx/html;
    index index.html;
    add_header X-Content-Type-Options nosniff always;

    # Resolve on requests, so an API container replacement is recoverable.
    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 3s;
    set $paper_api http://api:8000;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_connect_timeout 3s;
    proxy_read_timeout 75s;
    proxy_send_timeout 30s;

    location = /ui-health {
        default_type application/json;
        add_header Cache-Control no-store;
        return 200 '{"status":"ok","scope":"frontend"}';
    }

    location ~ ^/(api|socket\.io|ws)(/|$) {
        proxy_buffering off;
        proxy_pass $paper_api$request_uri;
    }

    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control no-store;
    }
}
