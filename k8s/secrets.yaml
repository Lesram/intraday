# Kubernetes Secrets for Algorithmic Trading Platform
# PRODUCTION - Create these secrets before deployment

apiVersion: v1
kind: Secret
metadata:
  name: algotrading-secrets
  namespace: algotrading
  labels:
    app: algotrading-api
    component: secrets
type: Opaque
stringData:
  # Database Configuration
  database-url: "postgresql+asyncpg://trading_user:CHANGE_DB_PASSWORD@postgres:5432/trading_platform"
  
  # JWT Security - PRODUCTION SECRET (64 characters)
  jwt-secret: "-su+!LL(*t2ej3Dk5LXyVwjRPctWyRDN#cYnJP3NwYniGVSiS9(!tL+4(9w_+^%D"

---
apiVersion: v1
kind: Secret
metadata:
  name: alpaca-secrets
  namespace: algotrading
  labels:
    app: algotrading-api
    component: broker-secrets
type: Opaque
stringData:
  # Alpaca Trading API Credentials
  # IMPORTANT: Replace with actual production Alpaca credentials
  api-key: "CHANGE_TO_REAL_ALPACA_API_KEY"
  secret-key: "CHANGE_TO_REAL_ALPACA_SECRET_KEY"
  api-key-id: "CHANGE_TO_REAL_ALPACA_API_KEY_ID"
  api-secret-key: "CHANGE_TO_REAL_ALPACA_API_SECRET_KEY"

---
# ConfigMap for non-sensitive production configuration
apiVersion: v1
kind: ConfigMap
metadata:
  name: algotrading-config
  namespace: algotrading
  labels:
    app: algotrading-api
    component: config
data:
  # Application Environment - PRODUCTION
  APP_ENVIRONMENT: "production"
  APP_LOG_LEVEL: "INFO"
  DEBUG: "false"
  
  # Database Pool Configuration
  DATABASE_POOL_SIZE: "30"
  DATABASE_MAX_OVERFLOW: "50"
  DATABASE_ECHO: "false"
  
  # JWT Configuration
  JWT_ALGORITHM: "HS256"
  JWT_EXPIRE_MINUTES: "60"
  
  # Observability Configuration
  OTEL_SERVICE_NAME: "algotrading-api-prod"
  OTEL_SERVICE_VERSION: "1.0.0"
  OTEL_ENABLED: "true"
  PROMETHEUS_ENABLED: "true"
  PROMETHEUS_PATH: "/metrics"
  
  # Alpaca Configuration
  ALPACA_BASE_URL: "https://api.alpaca.markets"
  ALPACA_DATA_URL: "https://data.alpaca.markets/v2"
  ALPACA_STREAM_URL: "wss://api.alpaca.markets/stream"
  ALPACA_PAPER: "false"  # Set to true for paper trading