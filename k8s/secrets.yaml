# ============================================================================
# Kubernetes Secrets for Algorithmic Trading Platform
# ============================================================================
# PRODUCTION DEPLOYMENT CHECKLIST:
# 1. NEVER deploy this file directly - use Kustomize overlays or External Secrets Operator
# 2. Generate secrets with: openssl rand -base64 48
# 3. Validate no placeholder values exist before deployment
# 4. Use a secrets manager (Vault, AWS Secrets Manager, etc.) for production
# ============================================================================

apiVersion: v1
kind: Secret
metadata:
  name: algotrading-secrets
  namespace: algotrading
  labels:
    app: algotrading-api
    component: secrets
  annotations:
    # SECURITY: This is a template - all values must be overridden
    security.algotrading/requires-override: "true"
type: Opaque
stringData:
  # Database Configuration
  # SECURITY (H-10): Must be set via Kustomize overlay or External Secrets
  database-url: "PLACEHOLDER_MUST_BE_OVERRIDDEN_VIA_KUSTOMIZE_OR_EXTERNAL_SECRETS"
  
  # JWT Security - MUST BE SET VIA EXTERNAL SECRETS OPERATOR
  # SECURITY (H-02): Generate with: openssl rand -base64 48 (minimum 32 bytes)
  jwt-secret: "PLACEHOLDER_MUST_BE_OVERRIDDEN_VIA_KUSTOMIZE_OR_EXTERNAL_SECRETS"
  
  # Admin User Credentials  
  # SECURITY (H-05): Must use strong passwords, never default values
  # Generate with: openssl rand -base64 16
  admin-username: \"PLACEHOLDER_MUST_BE_OVERRIDDEN\"
  admin-password: \"PLACEHOLDER_MUST_BE_OVERRIDDEN\"

---
apiVersion: v1
kind: Secret
metadata:
  name: alpaca-secrets
  namespace: algotrading
  labels:
    app: algotrading-api
    component: broker-secrets
type: Opaque
stringData:
  # Alpaca Trading API Credentials
  # IMPORTANT: Replace with actual production Alpaca credentials
  # SECURITY (H-11): For production, use ExternalSecrets Operator with Vault/AWS Secrets Manager
  api-key: "PLACEHOLDER_USE_EXTERNAL_SECRETS_OPERATOR"
  secret-key: "PLACEHOLDER_USE_EXTERNAL_SECRETS_OPERATOR"
  api-key-id: "PLACEHOLDER_USE_EXTERNAL_SECRETS_OPERATOR"
  api-secret-key: "PLACEHOLDER_USE_EXTERNAL_SECRETS_OPERATOR"

