---
# ConfigMap for non-sensitive production configuration
apiVersion: v1
kind: ConfigMap
metadata:
  name: algotrading-config
  namespace: algotrading
  labels:
    app: algotrading-api
    component: config
data:
  # Application Environment - PRODUCTION
  APP_ENVIRONMENT: "production"
  APP_LOG_LEVEL: "INFO"
  DEBUG: "false"
  
  # Admin User Configuration
  # Username is public, password comes from Secret
  ADMIN_USERNAME: "admin"
  
  # Database Pool Configuration
  DATABASE_POOL_SIZE: "30"
  DATABASE_MAX_OVERFLOW: "50"
  DATABASE_ECHO: "false"
  
  # JWT Configuration
  JWT_ALGORITHM: "HS256"
  JWT_EXPIRE_MINUTES: "60"
  
  # Observability Configuration
  OTEL_SERVICE_NAME: "algotrading-api-prod"
  OTEL_SERVICE_VERSION: "1.0.0"
  OTEL_ENABLED: "true"
  PROMETHEUS_ENABLED: "true"
  PROMETHEUS_PATH: "/metrics"
  
  # Alpaca Configuration
  ALPACA_BASE_URL: "https://api.alpaca.markets"
  ALPACA_DATA_URL: "https://data.alpaca.markets/v2"
  ALPACA_STREAM_URL: "wss://api.alpaca.markets/stream"
  ALPACA_PAPER: "false"  # Set to true for paper trading