[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
norecursedirs = scripts tools .venv venv build dist .git
addopts = -q --maxfail=0 --disable-warnings --timeout=30 --durations=5
# Disable all potential problematic plugins
disable_plugins = 
    respx
    httpx-pytest
    requests-mock
    asyncio-pytest
    pytest-asyncio
markers =
    api
    integration
    e2e
    ws
    chaos
    perf
    mlops
    services
    risk
