services:
  # Main API Service - Production Configuration
  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    ports:
      - "8000:8000"
    environment:
      # Application Settings - PRODUCTION
      - APP_ENVIRONMENT=production
      - APP_LOG_LEVEL=INFO
      - DEBUG=false

      # CORS (frontend origins)
      # Note: pydantic-settings treats list fields as JSON in env vars.
      - APP_CORS_ORIGINS=${APP_CORS_ORIGINS:-["http://localhost:3000","http://127.0.0.1:3000","http://localhost:5173","http://127.0.0.1:5173"]}
      - CORS_ORIGINS=${CORS_ORIGINS:-["http://localhost:3000","http://127.0.0.1:3000","http://localhost:5173","http://127.0.0.1:5173"]}

      # Database Configuration - Production DB
      # SECURITY FIX (H-10): Passwords must be set via environment variables, not hardcoded
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-trading_user}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/${POSTGRES_DB:-trading_platform}
      - DATABASE_POOL_SIZE=30
      - DATABASE_MAX_OVERFLOW=50
      - DATABASE_ECHO=false

      # Alpaca Configuration - Production API
      - ALPACA_BASE_URL=https://api.alpaca.markets
      - ALPACA_DATA_URL=https://data.alpaca.markets/v2
      - ALPACA_STREAM_URL=wss://api.alpaca.markets/stream
      # NOTE: Set ALPACA_API_KEY and ALPACA_SECRET_KEY via secrets or environment
      # For paper trading, use: https://paper-api.alpaca.markets

      # Security Settings - PRODUCTION SECURE JWT
      # SECURITY FIX (H-02): JWT secret MUST be set via environment, no defaults
      # Generate with: openssl rand -base64 48
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:?JWT_SECRET_KEY is required for production}
      - SECURITY_JWT_SECRET=${JWT_SECRET_KEY:?JWT_SECRET_KEY is required for production}
      - JWT_ALGORITHM=HS256
      - JWT_EXPIRE_MINUTES=60

      # Observability Settings
      - OTEL_SERVICE_NAME=algotrading-api-prod
      - OTEL_SERVICE_VERSION=1.0.0
      - OTEL_ENABLED=true
      - PROMETHEUS_ENABLED=true
      - PROMETHEUS_PATH=/metrics

      # Performance Settings
      - PYTHONPATH=/app
      - PYTHONUNBUFFERED=1
      - PYTHONDONTWRITEBYTECODE=1

    volumes:
      - ./logs:/app/logs
      - ./data:/app/data
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    restart: unless-stopped
    networks:
      - trading-network

  # Redis for Production Caching
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy allkeys-lru --save 900 1
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - trading-network

  postgres:
    image: postgres:16-alpine
    container_name: trading_platform_db
    environment:
      # SECURITY FIX (H-10): Passwords loaded from environment, not hardcoded
      POSTGRES_DB: ${POSTGRES_DB:-trading_platform}
      POSTGRES_USER: ${POSTGRES_USER:-trading_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD environment variable is required}
      POSTGRES_HOST_AUTH_METHOD: md5
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    command: >
      postgres
      -c shared_preload_libraries=pg_stat_statements
      -c pg_stat_statements.track=all
      -c max_connections=200
      -c shared_buffers=256MB
      -c effective_cache_size=1GB
      -c maintenance_work_mem=64MB
      -c checkpoint_completion_target=0.7
      -c wal_buffers=16MB
      -c default_statistics_target=100
      -c random_page_cost=1.1
      -c effective_io_concurrency=200
      -c work_mem=4MB
      -c min_wal_size=1GB
      -c max_wal_size=4GB
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trading_user -d trading_platform"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - trading-network

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  trading-network:
    driver: bridge