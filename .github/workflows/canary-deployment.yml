name: Canary Deployment with SLO-Based Promotion

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to deploy (e.g., v1.2.3)'
        required: true
        type: string
      canary_percentage:
        description: 'Percentage of traffic for canary (1-50)'
        required: false
        default: '10'
        type: string
      slo_check_duration:
        description: 'SLO check duration in minutes'
        required: false
        default: '15'
        type: string

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  PROMETHEUS_URL: ${{ secrets.PROMETHEUS_URL || 'http://prometheus.monitoring.svc.cluster.local:9090' }}
  STAGING_NAMESPACE: trading-platform-staging
  PROD_NAMESPACE: trading-platform-production

jobs:
  validate-inputs:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.validate.outputs.version }}
      canary_percentage: ${{ steps.validate.outputs.canary_percentage }}
      slo_check_duration: ${{ steps.validate.outputs.slo_check_duration }}
    steps:
      - name: Validate inputs
        id: validate
        run: |
          # Validate version format (semantic versioning)
          if [[ ! "${{ github.event.inputs.version }}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z-]+)?$ ]]; then
            echo "❌ Invalid version format. Expected: v1.2.3 or v1.2.3-beta1"
            exit 1
          fi
          
          # Validate canary percentage
          canary_pct=${{ github.event.inputs.canary_percentage }}
          if [[ $canary_pct -lt 1 || $canary_pct -gt 50 ]]; then
            echo "❌ Canary percentage must be between 1 and 50"
            exit 1
          fi
          
          # Validate SLO check duration
          slo_duration=${{ github.event.inputs.slo_check_duration }}
          if [[ $slo_duration -lt 5 || $slo_duration -gt 60 ]]; then
            echo "❌ SLO check duration must be between 5 and 60 minutes"
            exit 1
          fi
          
          echo "✅ All inputs validated"
          echo "version=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
          echo "canary_percentage=$canary_pct" >> $GITHUB_OUTPUT
          echo "slo_check_duration=$slo_duration" >> $GITHUB_OUTPUT

  deploy-canary:
    needs: validate-inputs
    runs-on: ubuntu-latest
    environment: production
    outputs:
      deployment_id: ${{ steps.deploy.outputs.deployment_id }}
      canary_endpoint: ${{ steps.deploy.outputs.canary_endpoint }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure kubectl
        run: |
          mkdir -p $HOME/.kube
          echo "${{ secrets.KUBE_CONFIG_PROD }}" | base64 -d > $HOME/.kube/config
          chmod 600 $HOME/.kube/config

      - name: Deploy canary version
        id: deploy
        run: |
          export VERSION="${{ needs.validate-inputs.outputs.version }}"
          export CANARY_PCT="${{ needs.validate-inputs.outputs.canary_percentage }}"
          export IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${VERSION}"
          
          echo "🚀 Deploying canary version ${VERSION} with ${CANARY_PCT}% traffic"
          
          # Create canary deployment
          cat <<EOF | kubectl apply -f -
          apiVersion: apps/v1
          kind: Deployment
          metadata:
            name: trading-platform-canary
            namespace: ${PROD_NAMESPACE}
            labels:
              app: trading-platform
              version: canary
              deployment-version: "${VERSION}"
          spec:
            replicas: 2
            selector:
              matchLabels:
                app: trading-platform
                version: canary
            template:
              metadata:
                labels:
                  app: trading-platform
                  version: canary
                  deployment-version: "${VERSION}"
                annotations:
                  prometheus.io/scrape: "true"
                  prometheus.io/port: "8000"
                  prometheus.io/path: "/metrics"
              spec:
                containers:
                - name: trading-platform
                  image: ${IMAGE}
                  ports:
                  - containerPort: 8000
                    name: http
                  env:
                  - name: DEPLOYMENT_TYPE
                    value: "canary"
                  - name: VERSION
                    value: "${VERSION}"
                  livenessProbe:
                    httpGet:
                      path: /health
                      port: 8000
                    initialDelaySeconds: 30
                    periodSeconds: 10
                  readinessProbe:
                    httpGet:
                      path: /readyz
                      port: 8000
                    initialDelaySeconds: 5
                    periodSeconds: 5
                  resources:
                    requests:
                      memory: "512Mi"
                      cpu: "250m"
                    limits:
                      memory: "1Gi"
                      cpu: "500m"
          EOF
          
          # Update service to split traffic
          kubectl patch service trading-platform -n ${PROD_NAMESPACE} -p '
          {
            "spec": {
              "selector": null
            }
          }'
          
          # Create traffic splitting with Istio VirtualService
          cat <<EOF | kubectl apply -f -
          apiVersion: networking.istio.io/v1beta1
          kind: VirtualService
          metadata:
            name: trading-platform-canary
            namespace: ${PROD_NAMESPACE}
          spec:
            hosts:
            - trading-platform
            http:
            - match:
              - headers:
                  x-canary-user:
                    exact: "true"
              route:
              - destination:
                  host: trading-platform
                  subset: canary
            - route:
              - destination:
                  host: trading-platform
                  subset: stable
                weight: $((100 - CANARY_PCT))
              - destination:
                  host: trading-platform
                  subset: canary
                weight: ${CANARY_PCT}
          EOF
          
          # Wait for canary to be ready
          echo "⏳ Waiting for canary deployment to be ready..."
          kubectl rollout status deployment/trading-platform-canary -n ${PROD_NAMESPACE} --timeout=300s
          
          # Generate deployment ID
          DEPLOYMENT_ID="canary-${VERSION}-$(date +%s)"
          echo "deployment_id=${DEPLOYMENT_ID}" >> $GITHUB_OUTPUT
          
          # Get canary endpoint for testing
          CANARY_ENDPOINT=$(kubectl get service trading-platform -n ${PROD_NAMESPACE} -o jsonpath='{.status.loadBalancer.ingress[0].hostname}')
          echo "canary_endpoint=https://${CANARY_ENDPOINT}" >> $GITHUB_OUTPUT
          
          echo "✅ Canary deployment ${DEPLOYMENT_ID} ready"

      - name: Run smoke tests on canary
        run: |
          echo "🧪 Running smoke tests on canary deployment..."
          
          # Run canary-specific smoke tests
          python -m pytest tests/smoke/test_smoke.py \
            -v --tb=short \
            -k "canary" \
            --base-url="${{ steps.deploy.outputs.canary_endpoint }}" \
            --canary-headers="x-canary-user: true"
          
          echo "✅ Canary smoke tests passed"

  slo-monitoring:
    needs: [validate-inputs, deploy-canary]
    runs-on: ubuntu-latest
    outputs:
      slo_status: ${{ steps.slo-check.outputs.status }}
      error_rate: ${{ steps.slo-check.outputs.error_rate }}
      p95_latency: ${{ steps.slo-check.outputs.p95_latency }}
      p99_latency: ${{ steps.slo-check.outputs.p99_latency }}
    steps:
      - name: Monitor SLO metrics
        id: slo-check
        run: |
          export DURATION_MINUTES="${{ needs.validate-inputs.outputs.slo_check_duration }}"
          export VERSION="${{ needs.validate-inputs.outputs.version }}"
          
          echo "📊 Monitoring SLO metrics for ${DURATION_MINUTES} minutes..."
          echo "🎯 SLO Thresholds: Error Rate < 1%, P95 < 2s, P99 < 5s"
          
          # SLO thresholds
          MAX_ERROR_RATE=1.0
          MAX_P95_LATENCY=2.0
          MAX_P99_LATENCY=5.0
          
          # Monitor for specified duration
          END_TIME=$(($(date +%s) + DURATION_MINUTES * 60))
          CHECK_INTERVAL=30  # Check every 30 seconds
          
          SLO_VIOLATIONS=0
          MAX_VIOLATIONS=3  # Allow 3 violations before failing
          
          while [ $(date +%s) -lt $END_TIME ]; do
            echo "🔍 Checking SLO metrics... ($(date))"
            
            # Query Prometheus for canary metrics
            ERROR_RATE=$(curl -s "${PROMETHEUS_URL}/api/v1/query" \
              --data-urlencode "query=sum(rate(intraday_http_requests_total{deployment_version=\"${VERSION}\",status=~\"5..\"}[5m])) / sum(rate(intraday_http_requests_total{deployment_version=\"${VERSION}\"}[5m])) * 100" \
              | jq -r '.data.result[0].value[1] // "0"')
            
            P95_LATENCY=$(curl -s "${PROMETHEUS_URL}/api/v1/query" \
              --data-urlencode "query=histogram_quantile(0.95, rate(intraday_http_request_duration_seconds_bucket{deployment_version=\"${VERSION}\"}[5m]))" \
              | jq -r '.data.result[0].value[1] // "0"')
            
            P99_LATENCY=$(curl -s "${PROMETHEUS_URL}/api/v1/query" \
              --data-urlencode "query=histogram_quantile(0.99, rate(intraday_http_request_duration_seconds_bucket{deployment_version=\"${VERSION}\"}[5m]))" \
              | jq -r '.data.result[0].value[1] // "0"')
            
            echo "📈 Current metrics:"
            echo "   Error Rate: ${ERROR_RATE}%"
            echo "   P95 Latency: ${P95_LATENCY}s"
            echo "   P99 Latency: ${P99_LATENCY}s"
            
            # Check SLO violations
            CURRENT_VIOLATIONS=0
            
            if (( $(echo "$ERROR_RATE > $MAX_ERROR_RATE" | bc -l) )); then
              echo "⚠️  SLO VIOLATION: Error rate ${ERROR_RATE}% exceeds ${MAX_ERROR_RATE}%"
              CURRENT_VIOLATIONS=$((CURRENT_VIOLATIONS + 1))
            fi
            
            if (( $(echo "$P95_LATENCY > $MAX_P95_LATENCY" | bc -l) )); then
              echo "⚠️  SLO VIOLATION: P95 latency ${P95_LATENCY}s exceeds ${MAX_P95_LATENCY}s"
              CURRENT_VIOLATIONS=$((CURRENT_VIOLATIONS + 1))
            fi
            
            if (( $(echo "$P99_LATENCY > $MAX_P99_LATENCY" | bc -l) )); then
              echo "⚠️  SLO VIOLATION: P99 latency ${P99_LATENCY}s exceeds ${MAX_P99_LATENCY}s"
              CURRENT_VIOLATIONS=$((CURRENT_VIOLATIONS + 1))
            fi
            
            if [ $CURRENT_VIOLATIONS -gt 0 ]; then
              SLO_VIOLATIONS=$((SLO_VIOLATIONS + 1))
              echo "❌ SLO check failed ($SLO_VIOLATIONS/$MAX_VIOLATIONS violations)"
              
              if [ $SLO_VIOLATIONS -ge $MAX_VIOLATIONS ]; then
                echo "💥 Maximum SLO violations reached - triggering rollback"
                echo "status=FAILED" >> $GITHUB_OUTPUT
                echo "error_rate=${ERROR_RATE}" >> $GITHUB_OUTPUT
                echo "p95_latency=${P95_LATENCY}" >> $GITHUB_OUTPUT
                echo "p99_latency=${P99_LATENCY}" >> $GITHUB_OUTPUT
                exit 1
              fi
            else
              echo "✅ SLO check passed"
              SLO_VIOLATIONS=0  # Reset violation counter on success
            fi
            
            sleep $CHECK_INTERVAL
          done
          
          echo "🎉 SLO monitoring completed successfully"
          echo "status=PASSED" >> $GITHUB_OUTPUT
          echo "error_rate=${ERROR_RATE}" >> $GITHUB_OUTPUT
          echo "p95_latency=${P95_LATENCY}" >> $GITHUB_OUTPUT
          echo "p99_latency=${P99_LATENCY}" >> $GITHUB_OUTPUT

  promote-or-rollback:
    needs: [validate-inputs, deploy-canary, slo-monitoring]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Configure kubectl
        run: |
          mkdir -p $HOME/.kube
          echo "${{ secrets.KUBE_CONFIG_PROD }}" | base64 -d > $HOME/.kube/config
          chmod 600 $HOME/.kube/config

      - name: Promote canary to production
        if: needs.slo-monitoring.outputs.slo_status == 'PASSED'
        run: |
          export VERSION="${{ needs.validate-inputs.outputs.version }}"
          
          echo "🚀 PROMOTING canary to full production"
          echo "📊 Final SLO metrics:"
          echo "   Error Rate: ${{ needs.slo-monitoring.outputs.error_rate }}%"
          echo "   P95 Latency: ${{ needs.slo-monitoring.outputs.p95_latency }}s"
          echo "   P99 Latency: ${{ needs.slo-monitoring.outputs.p99_latency }}s"
          
          # Update stable deployment to canary version
          kubectl set image deployment/trading-platform \
            trading-platform="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${VERSION}" \
            -n ${PROD_NAMESPACE}
          
          # Wait for rollout to complete
          kubectl rollout status deployment/trading-platform -n ${PROD_NAMESPACE} --timeout=300s
          
          # Remove traffic splitting - route all traffic to stable
          kubectl delete virtualservice trading-platform-canary -n ${PROD_NAMESPACE} --ignore-not-found=true
          
          # Remove canary deployment
          kubectl delete deployment trading-platform-canary -n ${PROD_NAMESPACE} --ignore-not-found=true
          
          echo "✅ Promotion completed successfully"
          
          # Create release tag
          git tag -a "${VERSION}-prod" -m "Production release ${VERSION} promoted from canary"
          git push origin "${VERSION}-prod"

      - name: Rollback canary deployment
        if: needs.slo-monitoring.outputs.slo_status != 'PASSED'
        run: |
          export VERSION="${{ needs.validate-inputs.outputs.version }}"
          
          echo "🚨 ROLLING BACK canary deployment due to SLO failures"
          echo "💥 Failed SLO metrics:"
          echo "   Error Rate: ${{ needs.slo-monitoring.outputs.error_rate }}%"
          echo "   P95 Latency: ${{ needs.slo-monitoring.outputs.p95_latency }}s"
          echo "   P99 Latency: ${{ needs.slo-monitoring.outputs.p99_latency }}s"
          
          # Remove traffic splitting
          kubectl delete virtualservice trading-platform-canary -n ${PROD_NAMESPACE} --ignore-not-found=true
          
          # Remove canary deployment
          kubectl delete deployment trading-platform-canary -n ${PROD_NAMESPACE} --ignore-not-found=true
          
          # Restore original service selector
          kubectl patch service trading-platform -n ${PROD_NAMESPACE} -p '
          {
            "spec": {
              "selector": {
                "app": "trading-platform",
                "version": "stable"
              }
            }
          }'
          
          echo "✅ Rollback completed successfully"
          
          # Create incident issue
          gh issue create \
            --title "🚨 Canary Deployment Rollback: ${VERSION}" \
            --body "Canary deployment ${VERSION} was rolled back due to SLO failures.
          
          **Failed Metrics:**
          - Error Rate: ${{ needs.slo-monitoring.outputs.error_rate }}% (threshold: 1.0%)
          - P95 Latency: ${{ needs.slo-monitoring.outputs.p95_latency }}s (threshold: 2.0s)
          - P99 Latency: ${{ needs.slo-monitoring.outputs.p99_latency }}s (threshold: 5.0s)
          
          **Next Actions:**
          1. Investigate performance regression
          2. Fix issues in development
          3. Re-test before next canary deployment
          
          **Deployment ID:** ${{ needs.deploy-canary.outputs.deployment_id }}" \
            --label "incident,rollback,canary"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Update deployment status
        run: |
          if [ "${{ needs.slo-monitoring.outputs.slo_status }}" = "PASSED" ]; then
            echo "🎉 CANARY DEPLOYMENT SUCCESSFUL"
            echo "✅ Version ${{ needs.validate-inputs.outputs.version }} promoted to production"
          else
            echo "💥 CANARY DEPLOYMENT FAILED"
            echo "🔄 Version ${{ needs.validate-inputs.outputs.version }} rolled back"
            exit 1
          fi
