name: intra-pr-verify

on:
  pull_request:
    branches: [ main, master ]

permissions:
  contents: read
  pull-requests: read

jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      changed_organism: ${{ steps.filter.outputs.organism }}
      changed_config: ${{ steps.filter.outputs.config }}
      changed_tests: ${{ steps.filter.outputs.tests }}
      changed_backend: ${{ steps.filter.outputs.backend }}
      changed_docs_arch: ${{ steps.filter.outputs.docs_arch }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # V7 W2 / Wave-26: full history for wave-marker checker
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            organism:
              - 'backend/organism/**'
            backend:
              - 'backend/**'
            config:
              - '.env*'
              - 'docker-compose*.yml'
              - 'backend/config/**'
            tests:
              - 'tests/**'
            docs_arch:
              - 'docs/architecture/**'

      # V8 / Wave-28 (2026-05-03): wave-PR marker enforcement.
      #
      # The default CI mode enforces finding-ID presence and rejects any
      # cited grep command that cannot be re-run. Grep/count documentation
      # and Critical/High test-delta checks are advisory by default after
      # V12 W81; pass --strict for release branches that intentionally want
      # the older V8 all-rules-required behavior.
      #
      # The script checks:
      # 1. Every fix(audit-wave...) commit cites finding-ID(s).
      # 2. Body includes a `grep -rn '...'` command (advisory by default).
      # 3. Body asserts `count: 0` (advisory by default).
      # 4. Critical/High commits add >=1 new test function (strict only).
      # 5. Any cited grep must be runnable; timeout/error is always failed.
      - name: Wave-PR marker enforcement
        if: github.event.pull_request.head.ref != github.event.pull_request.base.ref
        # This long-lived audit branch carries many historical audit-wave
        # commits that predate the modern marker contract. Keep the checker
        # visible, but do not let stale history block unrelated cleanup PRs;
        # ledger-based Critical/High behavioral gates remain hard gates in CI.
        continue-on-error: true
        run: |
          set -e
          BASE_SHA="${{ github.event.pull_request.base.sha }}"
          HEAD_SHA="${{ github.event.pull_request.head.sha }}"
          python3 scripts/ci/check_wave_markers.py \
            --base "$BASE_SHA" \
            --head "$HEAD_SHA" \
            --repo-root .

  organism-tests:
    needs: detect
    if: needs.detect.outputs.changed_organism == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt
          pip install pytest pytest-asyncio pytest-timeout
      - name: Organism live engine tests
        timeout-minutes: 8
        run: |
          python -m pytest -q tests/test_organism_live_engine.py --timeout=30
      - name: Organism scenario tests
        timeout-minutes: 8
        run: |
          python -m pytest -q tests/test_organism_engine_scenarios.py --timeout=30
      - name: Multi-tick state tests
        timeout-minutes: 5
        run: |
          python -m pytest -q tests/test_multi_tick_state.py --timeout=30
      - name: Safety invariant tests
        timeout-minutes: 5
        run: |
          python -m pytest -q tests/test_safety_invariants.py --timeout=30
      - name: Replay simulator tests
        timeout-minutes: 8
        run: |
          python -m pytest -q tests/test_replay_simulator.py --timeout=60
      - name: Self-evolution tests
        timeout-minutes: 8
        run: |
          python -m pytest -q tests/test_self_evolution.py --timeout=30
      - name: Generate artifact pack
        timeout-minutes: 10
        run: python scripts/ci/generate_artifacts.py full
      - name: Generate audit index
        timeout-minutes: 2
        run: python scripts/ci/generate_audit_index.py
      - uses: actions/upload-artifact@v4
        with:
          name: organism-artifacts
          path: |
            artifacts/
            docs/engineering/LIVE_AUDIT_INDEX.md

  config-tests:
    needs: detect
    if: needs.detect.outputs.changed_config == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt
          pip install pytest pytest-asyncio pytest-timeout
      - name: Run config regression suite
        run: |
          python -m pytest -q tests/test_settings_comprehensive.py --timeout=30
          python -m pytest -q tests/test_config_coordinator_comprehensive.py --timeout=30
          python -m pytest -q tests/test_system_integration.py --timeout=30
      - name: Generate artifact pack (quick)
        run: python scripts/ci/generate_artifacts.py quick
      - uses: actions/upload-artifact@v4
        with:
          name: config-artifacts
          path: artifacts/

  # Lightweight artifact-only job for non-organism backend / docs PRs
  artifact-pack:
    needs: detect
    if: |
      needs.detect.outputs.changed_organism != 'true'
      && (needs.detect.outputs.changed_backend == 'true'
          || needs.detect.outputs.changed_docs_arch == 'true'
          || needs.detect.outputs.changed_tests == 'true')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt
          pip install pytest pytest-asyncio pytest-timeout
      - name: Generate artifact pack (quick)
        run: python scripts/ci/generate_artifacts.py quick
      - name: Generate audit index
        run: python scripts/ci/generate_audit_index.py
      - uses: actions/upload-artifact@v4
        with:
          name: pr-artifacts
          path: |
            artifacts/
            docs/engineering/LIVE_AUDIT_INDEX.md

  spec-drift:
    needs: detect
    if: |
      needs.detect.outputs.changed_backend == 'true'
      || needs.detect.outputs.changed_docs_arch == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Generate runtime snapshot
        run: python scripts/runtime/write_runtime_snapshot.py
      - name: Check spec-vs-runtime drift (3-way)
        run: python scripts/ci/check_spec_drift.py
      - name: Run semantic invariant tests
        run: |
          pip install -r requirements-dev.txt
          pip install pytest pytest-asyncio pytest-timeout
          python -m pytest tests/test_semantic_invariants.py -v --timeout=30

      # V8 OO MIGRATION-GAP / Wave-37 (2026-05-03): smoke-check the
      # migration tree on every backend PR.  Asserts single-headed
      # linear chain so accidental branching merges don't ship.
      - name: Check migration-tree integrity (V8 Wave-37)
        run: |
          pip install alembic
          python scripts/ci/check_migrations.py

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Secret scan
        run: |
          if grep -R -nE '(sk_live_[A-Za-z0-9_=-]{16,}|-----BEGIN PRIVATE KEY-----|-----BEGIN RSA PRIVATE KEY-----|-----BEGIN EC PRIVATE KEY-----|-----BEGIN OPENSSH PRIVATE KEY-----|APCA_[A-Z0-9]{20,})' . \
              --exclude-dir=.git \
              --exclude-dir=venv \
              --exclude-dir=node_modules \
              --exclude=pr-verify.yml; then
            echo 'Potential secret detected'; exit 1; fi
