# L-15: Container Image Security Scanning with Trivy
#
# This workflow scans container images for vulnerabilities using Trivy.
# Runs on:
#   - Every push to main/develop branches
#   - Pull requests to main/develop
#   - Weekly scheduled scan (Sundays at 2 AM UTC)
#   - Manual trigger

name: "🔒 Container Security Scan"

on:
  push:
    branches: [main, develop]
    paths:
      - 'Dockerfile*'
      - 'docker-compose*.yml'
      - 'requirements*.txt'
      - '.github/workflows/security-scan.yml'
  pull_request:
    branches: [main, develop]
    paths:
      - 'Dockerfile*'
      - 'docker-compose*.yml'
      - 'requirements*.txt'
  schedule:
    # Weekly scan on Sundays at 2 AM UTC
    - cron: '0 2 * * 0'
  workflow_dispatch:
    inputs:
      severity:
        description: 'Minimum severity to report'
        required: false
        default: 'MEDIUM'
        type: choice
        options:
          - CRITICAL
          - HIGH
          - MEDIUM
          - LOW

env:
  REGISTRY: ghcr.io
  # Use a lowercase local tag.  `${{ github.repository }}` preserves
  # owner casing (e.g. Lesram/intraday), which Docker rejects as a tag.
  IMAGE_NAME: intra-security-scan

jobs:
  trivy-scan-dockerfile:
    name: "🔍 Scan Dockerfile"
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Free runner disk before image build
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true
          docker system prune -af || true
          df -h

      - name: Build Docker image for scanning
        run: |
          docker build -t ${{ env.IMAGE_NAME }}:scan -f Dockerfile .

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: '${{ env.IMAGE_NAME }}:scan'
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: ${{ github.event.inputs.severity || 'MEDIUM' }},HIGH,CRITICAL
          ignore-unfixed: true

      - name: Upload Trivy scan results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v3
        if: always() && hashFiles('trivy-results.sarif') != ''
        with:
          sarif_file: 'trivy-results.sarif'

      - name: Run Trivy for table output
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: '${{ env.IMAGE_NAME }}:scan'
          format: 'table'
          severity: 'HIGH,CRITICAL'
          ignore-unfixed: true
          exit-code: '1'  # Fail on HIGH/CRITICAL vulnerabilities

  trivy-scan-production:
    name: "🔍 Scan Production Dockerfile"
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check for production Dockerfile
        id: production-dockerfile
        run: |
          if [ -f Dockerfile.production ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "Dockerfile.production not present; skipping production image scan."
          fi

      - name: Free runner disk before production image build
        if: steps.production-dockerfile.outputs.exists == 'true'
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true
          docker system prune -af || true
          df -h

      - name: Build Production Docker image for scanning
        if: steps.production-dockerfile.outputs.exists == 'true'
        run: |
          docker build -t ${{ env.IMAGE_NAME }}:prod-scan -f Dockerfile.production .

      - name: Run Trivy vulnerability scanner
        if: steps.production-dockerfile.outputs.exists == 'true'
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: '${{ env.IMAGE_NAME }}:prod-scan'
          format: 'sarif'
          output: 'trivy-prod-results.sarif'
          severity: ${{ github.event.inputs.severity || 'MEDIUM' }},HIGH,CRITICAL
          ignore-unfixed: true

      - name: Upload Trivy scan results to GitHub Security tab
        if: always() && steps.production-dockerfile.outputs.exists == 'true' && hashFiles('trivy-prod-results.sarif') != ''
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: 'trivy-prod-results.sarif'
          category: 'trivy-production'

      - name: Run Trivy for table output (Production)
        if: steps.production-dockerfile.outputs.exists == 'true'
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: '${{ env.IMAGE_NAME }}:prod-scan'
          format: 'table'
          severity: 'HIGH,CRITICAL'
          ignore-unfixed: true
          exit-code: '1'

  trivy-scan-fs:
    name: "📁 Scan Filesystem/IaC"
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Trivy filesystem scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-fs-results.sarif'
          severity: 'MEDIUM,HIGH,CRITICAL'
          scanners: 'vuln,secret,misconfig'

      - name: Upload filesystem scan results
        uses: github/codeql-action/upload-sarif@v3
        if: always() && hashFiles('trivy-fs-results.sarif') != ''
        with:
          sarif_file: 'trivy-fs-results.sarif'
          category: 'trivy-filesystem'

      - name: Scan for secrets and misconfigurations
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'config'
          scan-ref: '.'
          format: 'table'
          exit-code: '0'  # Don't fail on misconfig, just report

  trivy-sbom:
    name: "📋 Generate SBOM"
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Generate SBOM
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'cyclonedx'
          output: 'sbom.json'

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom.json
          retention-days: 90

  scan-summary:
    name: "📊 Scan Summary"
    runs-on: ubuntu-latest
    needs: [trivy-scan-dockerfile, trivy-scan-fs]
    if: always()

    steps:
      - name: Create scan summary
        run: |
          echo "## 🔒 Container Security Scan Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Scan | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Dockerfile | ${{ needs.trivy-scan-dockerfile.result == 'success' && '✅ Passed' || '❌ Failed' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Filesystem | ${{ needs.trivy-scan-fs.result == 'success' && '✅ Passed' || '❌ Failed' }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "View detailed results in the [Security tab](../../security/code-scanning)." >> $GITHUB_STEP_SUMMARY
