name: paper-postclose-audit

on:
  workflow_dispatch:
  schedule:
    - cron: '15 22 * * 1-5'

jobs:
  collect-and-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt
          pip install pytest pytest-asyncio pytest-timeout
      - name: Write runtime snapshot
        run: python scripts/runtime/write_runtime_snapshot.py || true
      - name: Run replay audit subset
        run: |
          python -m pytest -q tests/test_replay_simulator.py --timeout=60 || true
          python -m pytest -q tests/test_safety_invariants.py --timeout=30 || true
      - uses: actions/upload-artifact@v4
        with:
          name: postclose-artifacts
          path: artifacts/
