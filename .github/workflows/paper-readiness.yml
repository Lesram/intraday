name: paper-readiness

on:
  pull_request:
    branches: ['intra-2.0-phase1']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  operational-safety:
    runs-on: ubuntu-latest
    timeout-minutes: 125
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONPATH: .
      USE_MOCK_BROKER: 'true'
      USE_MOCK_DATA: 'true'
      APP_ENVIRONMENT: testing
      ENVIRONMENT: testing
      TESTING: 'true'
      TRADING_EXECUTION_MODE: shadow
      DATABASE_URL: 'sqlite+aiosqlite:///:memory:'
      SECURITY_JWT_SECRET: 'test-jwt-secret-not-for-production'
      PICKLE_HMAC_SECRET: 'test-pickle-secret-not-for-production'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Configure isolated test paths
        timeout-minutes: 1
        shell: bash
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          scratch = Path(os.environ["RUNNER_TEMP"])
          with Path(os.environ["GITHUB_ENV"]).open("a") as output:
              output.write("ORGANISM_BRAIN_DIR=" + str(scratch / "paper-readiness-brain") + "\n")
              output.write("ORGANISM_SHADOW_EXIT_TELEMETRY_PATH=" + str(scratch / "paper-readiness-brain/shadow.jsonl") + "\n")
              output.write("ORGANISM_CANDIDATE_FILTER_SHADOW_TELEMETRY_PATH=" + str(scratch / "paper-readiness-brain/filter.jsonl") + "\n")
              output.write("ORGANISM_STRATEGY_EVIDENCE_TELEMETRY_PATH=" + str(scratch / "paper-readiness-brain/strategy.jsonl") + "\n")
          PY
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.lock
      - name: Install pinned dependencies
        timeout-minutes: 10
        run: |
          python -m pip install -r requirements.lock
          python - <<'PYCODE'
          import pathlib, subprocess, sys
          pins = [line.split()[0] for line in pathlib.Path('requirements-dev.txt').read_text().splitlines()
                  if line.startswith('ruff==')]
          if len(pins) != 1:
              raise SystemExit('Expected the single pinned Ruff version used by the lint-ratchet tests')
          subprocess.run([sys.executable, '-m', 'pip', 'install', pins[0]], check=True)
          PYCODE
      - name: Verify operational fixes and trading safety
        timeout-minutes: 10
        shell: bash
        run: |
          set -o pipefail
          mkdir -p artifacts/monday_readiness
          python -m pytest -q --timeout=30 --tb=short \
            tests/test_paper_monitor_access.py \
            tests/test_infra_security_comprehensive.py \
            tests/test_websocket_and_signal_service.py \
            tests/test_v12_w78_deploy_health.py \
            tests/test_v13_w95_data_integrity.py \
            tests/test_security_boundaries.py \
            tests/test_developer_tool_credentials.py \
            tests/test_v13_security_cleanup.py \
            tests/test_order_integrity_comprehensive.py \
            tests/test_broker_ack_reconciliation.py \
            tests/test_adversarial_inputs_v7.py \
            tests/test_position_reconciliation.py \
            tests/test_position_reconciliation_comprehensive.py \
            tests/test_settings_comprehensive.py \
            tests/test_config_coordinator_comprehensive.py \
            tests/test_system_integration.py \
            tests/test_order_pipeline_e2e.py \
            tests/test_audit_0_4_eod_flatten_escalation.py \
            tests/test_paper_runtime_config.py \
            tests/test_paper_frontend_deployment.py \
            tests/test_frontend_container_probe.py \
            tests/test_admin_trading_execution_mode.py \
            tests/test_paper_watchdog.py \
            tests/test_session_logging_contract.py \
            tests/test_api_fixture_isolation.py \
            tests/test_paper_backup_recovery.py \
            tests/test_paper_fill_reconciliation.py \
            tests/test_fill_accounting_integrity.py \
            tests/test_order_recovery_service.py \
            tests/test_outbox_fill_race.py \
            tests/test_away_mode_wave_b.py \
            tests/test_portfolio_availability_contract.py \
            tests/test_portfolio_service_comprehensive.py \
            tests/test_socketio_topic_authorization.py \
            tests/unit/test_alpaca_data_comprehensive.py \
            tests/unit/test_streaming_data_provider.py \
            tests/unit/test_paper_data_freshness.py \
            tests/test_market_scanner.py \
            tests/test_market_scanner_provider_contract.py \
            tests/test_pipeline_freshness_recovery.py \
            tests/test_scanner_streaming_integration.py \
            tests/test_pipeline_diagnostics.py \
            tests/test_pipeline_profile.py \
            tests/test_composite_indicator_contract.py \
            tests/test_readiness_contract.py \
            tests/test_streaming_provider_lifecycle.py \
            tests/test_active_freeze_contract.py \
            tests/test_artifact_change_scope.py \
            tests/test_pipeline_snapshot.py \
            tests/test_v13_w100_live_tick_coverage.py \
            tests/test_scanner_pipeline_integration.py \
            tests/test_live_engine_fill_accounting.py \
            tests/test_pending_close_accounting.py \
            tests/test_replay_close_accounting.py \
            tests/test_entry_evidence.py \
            tests/test_entry_freshness.py \
            tests/test_entry_freshness_snapshot.py \
            tests/test_runtime_snapshot_auth.py \
            tests/test_walkforward_persistence.py \
            tests/test_paper_daily_evidence.py \
            tests/test_paper_daily_host.py \
            tests/test_operator_controls.py \
            tests/test_operator_emergency_stop.py \
            tests/test_apr7_p0_p1_fixes.py \
            tests/test_phase9_strategy_governance.py \
            tests/test_risk_manager_comprehensive.py \
            tests/test_risk_manager_service_comprehensive.py \
            tests/test_research_policy_lock.py \
            tests/test_research_baseline.py \
            tests/test_research_model_fingerprint.py \
            tests/test_apr10_patch_f4_forensic_guard.py \
            tests/test_apr8_patch_a_force_save.py \
            tests/test_audit_patch_queue_b1.py \
            tests/test_audit_patch_queue_j6.py \
            tests/test_remediation_wave_b.py \
            tests/test_audit_patch_queue_b2.py \
            tests/test_v12_baseline_invariants.py \
            tests/test_standdown_session_row.py \
            tests/test_phase3_attribution_report.py \
            --junitxml=artifacts/monday_readiness/github_operational.xml \
            2>&1 | tee artifacts/monday_readiness/github_operational.log
      - name: Verify approved data and cancellation repairs
        timeout-minutes: 10
        shell: bash
        run: |
          set -o pipefail
          mkdir -p artifacts/frozen_repairs_20260927
          python -m pytest -q --timeout=30 --tb=short \
            tests/test_streaming_subscription_acknowledgement.py \
            tests/test_cross_asset_timestamp_alignment.py \
            tests/test_eod_pending_cancellation.py \
            tests/test_eod_cancellation_fairness.py \
            tests/unit/test_alpaca_market_data_stream_comprehensive.py \
            tests/unit/test_streaming_data_provider.py \
            tests/test_streaming_provider_lifecycle.py \
            --junitxml=artifacts/frozen_repairs_20260927/github_targeted.xml \
            2>&1 | tee artifacts/frozen_repairs_20260927/github_targeted.log
      - name: Paired composite-input trading replay
        timeout-minutes: 10
        shell: bash
        run: |
          set -o pipefail
          mkdir -p artifacts/composite_indicator_repair/replay
          rm -f artifacts/composite_indicator_repair/replay/github_replay.xml artifacts/composite_indicator_repair/replay/paired_summary.json
          python -m pytest -q --timeout=30 --tb=short --durations=10 \
            tests/test_composite_correction_replay.py \
            tests/test_cross_asset_alignment_replay.py \
            --junitxml=artifacts/composite_indicator_repair/replay/github_replay.xml \
            2>&1 | tee artifacts/composite_indicator_repair/replay/github_replay.log
      - name: Verify nightly test harness repairs
        if: always()
        timeout-minutes: 10
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
          PYTEST_ADDOPTS: '-p pytest_asyncio.plugin -p pytest_timeout -p no:cacheprovider'
        shell: bash
        run: |
          set -o pipefail
          mkdir -p artifacts/nightly_test_harness
          rm -f artifacts/nightly_test_harness/github_targeted.xml
          python -m pytest -q --timeout=30 --tb=short --durations=10 \
            tests/test_wave37_fixes.py \
            tests/test_wave48_fixes.py \
            tests/test_wave51_fixes.py \
            tests/test_wave52_fixes.py \
            tests/unit/test_api_routes_mocked_coverage.py \
            tests/test_nightly_test_contract.py \
            tests/test_wave55_fixes.py \
            tests/test_wave61_fixes.py \
            tests/test_reachability_v8.py \
            tests/test_v12_w75_lint_ratchet.py \
            tests/test_v12_w77_findings_ledger.py \
            tests/test_v12_w81_ci_cleanup.py \
            tests/unit/test_auth_security_phase4.py \
            tests/test_strategy_engine_comprehensive.py \
            tests/test_organism_integration_smoke.py \
            tests/test_phase2_freeze.py \
            tests/test_v12_w84_governance_docs.py \
            --junitxml=artifacts/nightly_test_harness/github_targeted.xml \
            2>&1 | tee artifacts/nightly_test_harness/github_targeted.log
      - name: Verify candidate surface without changing active authority
        timeout-minutes: 2
        shell: bash
        run: |
          python - <<'PY'
          import json, os, pathlib, subprocess, sys
          root = pathlib.Path.cwd()
          reference = root / 'artifacts/monday_readiness/frozen_surface_reference.json'
          target = root / 'artifacts/phase2/param_freeze.json'
          before = target.read_bytes()
          assert before == reference.read_bytes(), "Approved active references differ"
          env = dict(os.environ)
          env.update(json.loads((root / 'artifacts/monday_readiness/freeze_environment.json').read_text()))
          subprocess.run([sys.executable, 'scripts/phase2_freeze.py', '--verify', '--candidate'], env=env, check=True)
          assert target.read_bytes() == before, "Candidate verification changed active authority"
          PY
      - name: Full safety and replay artifact pack
        if: always()
        timeout-minutes: 50
        run: python scripts/ci/generate_artifacts.py full
      - name: Audit index
        if: always()
        timeout-minutes: 1
        run: python scripts/ci/generate_audit_index.py
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Verify operator dashboard and login
        timeout-minutes: 10
        working-directory: frontend
        env:
          VITE_DEV_BYPASS_AUTH: 'false'
        shell: bash
        run: |
          set -o pipefail
          npm ci --no-audit --no-fund
          npx --no-install vitest run \
            src/components/auth/AuthBootstrap.test.tsx \
            src/features/organism/__tests__/OrganismDashboard.test.tsx \
            src/features/auth/LoginPage.test.tsx \
            src/hooks/useScannerWebSocket.test.tsx \
            src/services/marketDataWebSocketService.test.ts \
            src/components/layout/GlobalStatusBar.test.tsx \
            src/features/dashboard/Dashboard.test.tsx \
            src/features/portfolio/PortfolioPage.test.tsx \
            src/hooks/usePortfolio.test.tsx \
            src/services/api.test.ts \
            src/services/originRouting.test.ts \
            src/services/authService.test.tsx \
            src/services/websocketManager.test.tsx \
            src/utils/portfolioSnapshot.test.ts \
            --reporter=junit --outputFile=../artifacts/monday_readiness/github_frontend.xml
          npm run build 2>&1 | tee ../artifacts/monday_readiness/github_frontend_build.log
          npx --yes agent-browser@0.38.1 --version
          task_browser_path="$(command -v google-chrome)"
          test -x "$task_browser_path"
          AGENT_BROWSER_EXECUTABLE_PATH="$task_browser_path" \
            python ../scripts/ci/check_frontend_preview.py \
              --output-dir ../artifacts/monday_readiness/frontend_browser
      - uses: actions/upload-artifact@v4
        if: always()
        timeout-minutes: 2
        with:
          name: paper-readiness-evidence
          path: |
            artifacts/
            docs/engineering/LIVE_AUDIT_INDEX.md
          if-no-files-found: error

  frontend-container:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Build immutable local operator UI
        timeout-minutes: 12
        run: docker build --file frontend/Dockerfile --build-arg VCS_REF="$GITHUB_SHA" --tag intra-operator-ui:ci .
      - name: Verify proxy, websocket and API replacement behavior
        timeout-minutes: 5
        run: python3 scripts/ci/check_frontend_container.py --image intra-operator-ui:ci --output-dir artifacts/frontend_container
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frontend-container-evidence
          path: artifacts/frontend_container/
          if-no-files-found: error

  fill-accounting-postgres:
    runs-on: ubuntu-latest
    container: python:3.12-bookworm
    timeout-minutes: 20
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONPATH: .
      PYTHON_DOTENV_DISABLED: '1'
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
      PYTEST_ADDOPTS: '-p pytest_asyncio.plugin -p pytest_timeout -p no:cacheprovider'
      TESTING: 'true'
      APP_ENVIRONMENT: testing
      ENVIRONMENT: testing
      USE_MOCK_BROKER: 'true'
      USE_MOCK_DATA: 'true'
      TRADING_EXECUTION_MODE: shadow
      SECURITY_JWT_SECRET: 'test-jwt-secret-not-for-production'
      PICKLE_HMAC_SECRET: 'test-pickle-secret-not-for-production'
      DATABASE_URL: 'sqlite+aiosqlite:///:memory:'
      INTRA_FILL_TEST_DATABASE_URL: 'postgresql+asyncpg://test_fill_accounting:synthetic@intra-fill-postgres/test_fill_accounting'
    services:
      intra-fill-postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: test_fill_accounting
          POSTGRES_USER: test_fill_accounting
          POSTGRES_PASSWORD: synthetic
        options: >-
          --health-cmd "pg_isready -U test_fill_accounting -d test_fill_accounting"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install pinned dependencies
        timeout-minutes: 12
        run: python -m pip install -r requirements.lock
      - name: Exercise actual PostgreSQL row contention
        timeout-minutes: 2
        run: |
          mkdir -p artifacts/platform_audit_20260926/execution_accounting
          python -m pytest -q tests/test_fill_accounting_postgres.py --timeout=30 \
            --junitxml=artifacts/platform_audit_20260926/execution_accounting/postgres_ci.xml
          python - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          path = Path('artifacts/platform_audit_20260926/execution_accounting/postgres_ci.xml')
          cases = list(ET.parse(path).getroot().iter('testcase'))
          assert len(cases) >= 12, 'Required contention, recovery and ACK evidence missing'
          assert all(not any(case.find(tag) is not None for tag in ('failure', 'error', 'skipped')) for case in cases), 'All PostgreSQL cases must execute and pass'
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fill-accounting-postgres-evidence
          path: artifacts/platform_audit_20260926/execution_accounting/postgres_ci.xml
          if-no-files-found: error
          retention-days: 14
