[pytest]
# Discover tests under the unified test/ directory (including subdirectories like test/module)
testpaths = test

# Standard naming convention for test files
python_files = test_*.py

# Do not recurse into these directories during test discovery
norecursedirs = .venv venv node_modules dist build .git .mypy_cache .ruff_cache .pytest_cache data logs

# Enable asyncio test support without needing explicit markers
asyncio_mode = auto

# Custom markers for test organization
markers =
    unit: Unit tests (fast, isolated, no external dependencies)
    integration: Integration tests (requires services/database)
    api: API endpoint tests
    services: Service layer tests
    performance: Performance SLO tests (enforce hard latency/throughput requirements)
    slow: Slow running tests (> 5 seconds)

