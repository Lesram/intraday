[pytest]
asyncio_mode = auto
markers =
    integration: marks tests as integration tests (may require external dependencies)
    slow: marks tests as slow running
    unit: marks tests as unit tests
    perf: marks tests as performance/load tests (require specific infrastructure)
    chaos: marks tests as chaos engineering tests (intentional fault injection)
    core: core platform spine tests for app factory and DI

testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Coverage configuration
addopts = 
    --strict-markers
    --strict-config
    --cov=backend
    --cov-report=term-missing
    --cov-report=xml
    --cov-fail-under=85
    
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
