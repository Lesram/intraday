[pytest]
asyncio_mode = auto
addopts = -q --maxfail=0 --disable-warnings
python_files = test_*.py
testpaths = tests
# keep tools/scripts out of discovery
norecursedirs = .* build dist venv .venv scripts tools
markers =
    api
    integration
    e2e
    ws
    chaos
    perf
    mlops
    services
    risk
