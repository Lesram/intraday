[pytest]
asyncio_mode = auto
markers =
    unit: marks tests as unit tests (fast, isolated)
    integration: marks tests as integration tests (may require external dependencies)
    api: marks tests as API endpoint tests (HTTP/WebSocket)
    services: marks tests as service layer tests (business logic)
    security: marks tests as security-related tests (auth/authz/validation)
    strategies: marks tests as strategy/trading logic tests
    e2e: marks tests as end-to-end tests (full system testing)
    performance: marks tests as performance/load tests (require specific infrastructure)
    perf: marks tests as performance/micro-benchmark tests (performance testing)
    fuzz: marks tests as property-based/fuzz tests (chaos testing)
    property: marks tests as property-based tests using Hypothesis
    contract: marks tests as contract tests for FSM validation
    slow: marks tests as slow running
    core: core platform spine tests for app factory and DI
    metrics: marks tests as metrics-related for prometheus registry testing
    chaos: marks tests as chaos engineering tests (intentional fault injection)
    broker: marks tests that require broker simulation/mocking
    ml: marks tests for ML model components
    backtest: marks tests for backtesting engine
    risk: marks tests for risk management components
    features: marks tests for feature engineering
    data: marks tests for data ingestion/processing
    websocket: marks tests for WebSocket functionality
    auth: marks tests for authentication/authorization
    observability: marks tests for logging/metrics/monitoring

testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Coverage configuration - target 40% initially with per-package minimums
addopts =
    --strict-markers
    --strict-config
    --cov=backend
    --cov-report=term-missing
    --cov-report=xml:coverage.xml
    --cov-report=html:htmlcov
    --cov-fail-under=40
    --cov-branch
    --tb=short
    --durations=10
    --timeout=60
    --ignore=tests/fixtures/
    --ignore=tests/helpers/
    --disable-warnings
    -W ignore::DeprecationWarning:tensorflow.*
    -W ignore::DeprecationWarning:freezegun.*
    -W ignore::UserWarning:tensorflow.*

# Test discovery and execution options
minversion = 7.0
timeout = 60
timeout_method = thread

# Warning filters to suppress various deprecation and compatibility warnings
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
    ignore::UserWarning:pandas.*
    ignore::UserWarning:sklearn.*
    ignore::FutureWarning:tensorflow.*
    ignore::DeprecationWarning:tensorflow.*
    ignore::DeprecationWarning:freezegun.*
    ignore::UserWarning:tensorflow.*
    ignore:.*tf\..*is deprecated.*:DeprecationWarning
    ignore:.*tensorflow.*deprecated.*:DeprecationWarning
    ignore:.*The name tf\..*is deprecated.*:UserWarning
    ignore:From.*freezegun.*tensorflow.*deprecated.*:UserWarning
