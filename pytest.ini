[pytest]
# Enhanced configuration for unified test suite (Updated: September 16, 2025)
asyncio_mode = auto

# Test discovery and execution settings
python_files = test_*.py *_test.py
testpaths = tests
python_classes = Test* *Tests
python_functions = test_*

# Optimized execution options
addopts = 
    -v
    --strict-markers
    --strict-config
    --tb=short
    --maxfail=0
    --disable-warnings
    --timeout=30
    --durations=10

# Directory exclusions (keep tools/scripts/legacy out of discovery)
norecursedirs = 
    .* 
    build 
    dist 
    venv 
    .venv 
    scripts 
    tools 
    to_be_removed
    __pycache__
    *.egg-info
    htmlcov

# Test markers for categorization
markers =
    api: API endpoint tests
    integration: Integration tests requiring external dependencies
    e2e: End-to-end tests
    ws: WebSocket tests
    chaos: Chaos engineering tests
    perf: Performance tests
    mlops: Machine learning operations tests
    services: Service layer tests
    risk: Risk management tests
    unit: Unit tests (isolated, fast)
    slow: Tests that take more than 1 second
    database: Tests requiring database
    auth: Authentication/authorization tests
    config: Configuration tests
    
# Timeout settings
timeout = 30
timeout_method = thread
