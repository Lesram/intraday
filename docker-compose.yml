# Docker Compose for Development/Staging Environment
# BRANCH 2.12 - Deploy Readiness

services:
  # Main API Service
  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    ports:
      - "8000:8000"
    environment:
      # Application Settings
      - APP_ENVIRONMENT=development
      - APP_LOG_LEVEL=INFO
      - APP_DEBUG=false

      # CORS (frontend dev servers)
      # Override with APP_CORS_ORIGINS in .env if needed
      # Note: pydantic-settings treats list fields as JSON in env vars.
      - APP_CORS_ORIGINS=${APP_CORS_ORIGINS:-["http://localhost:3000","http://127.0.0.1:3000","http://localhost:5173","http://127.0.0.1:5173"]}

      # Database Configuration
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-trading}:${POSTGRES_PASSWORD:-trading_password}@db:5432/${POSTGRES_DB:-algotrading}
      - DATABASE_POOL_SIZE=20
      - DATABASE_MAX_OVERFLOW=30
      - DATABASE_ECHO=false

      # Alpaca Configuration (use test credentials)
      - ALPACA_API_KEY=${ALPACA_API_KEY:-dummy_key_for_testing}
      - ALPACA_SECRET_KEY=${ALPACA_SECRET_KEY:-dummy_secret_for_testing}
      - ALPACA_API_KEY_ID=${ALPACA_API_KEY_ID:-}
      - ALPACA_API_SECRET_KEY=${ALPACA_API_SECRET_KEY:-}
      - ALPACA_BASE_URL=${ALPACA_BASE_URL:-https://paper-api.alpaca.markets}
      - ALPACA_DATA_URL=${ALPACA_DATA_URL:-}
      - ALPACA_STREAM_URL=${ALPACA_STREAM_URL:-}
      - ALPACA_DATA_FEED=${ALPACA_DATA_FEED:-iex}

      # Security Settings - MUST be overridden in production via .env file
      # Generate a secure key: python -c "import secrets; print(secrets.token_urlsafe(32))"
      # For local dev this defaults to an insecure value; override in .env for anything beyond local.
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:?JWT_SECRET_KEY must be set in .env}
      - JWT_ALGORITHM=HS256
      - JWT_EXPIRE_MINUTES=60
      - SECURITY_JWT_SECRET=${JWT_SECRET_KEY:?JWT_SECRET_KEY must be set}

      # Observability Settings
      - OTEL_SERVICE_NAME=algotrading-api
      - OTEL_SERVICE_VERSION=1.0.0
      - OTEL_ENABLED=true
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4317
      - PROMETHEUS_ENABLED=true
      - PROMETHEUS_PATH=/metrics

      # Feature Flags
      - ENABLE_OUTBOX_PATTERN=true
      - ENABLE_BACKGROUND_TASKS=true
      - ENABLE_WEBSOCKET=true

      # Organism Engine
      - ORGANISM_ENABLED=${ORGANISM_ENABLED:-0}
      - ENABLE_ORGANISM_SCHEDULER=${ENABLE_ORGANISM_SCHEDULER:-0}
      - ORGANISM_LIVE_TIMEFRAME=${ORGANISM_LIVE_TIMEFRAME:-1Min}
      - ORGANISM_TICK_INTERVAL_SECONDS=${ORGANISM_TICK_INTERVAL_SECONDS:-60}
      - ORGANISM_LIVE_SYMBOLS=${ORGANISM_LIVE_SYMBOLS:-SPY,QQQ}
      - ORGANISM_LIVE_LOOKBACK=${ORGANISM_LIVE_LOOKBACK:-100}
      - ORGANISM_MIN_BARS=${ORGANISM_MIN_BARS:-50}
      - ORGANISM_MAX_POSITIONS=${ORGANISM_MAX_POSITIONS:-15}
      - ORGANISM_LONG_ONLY=${ORGANISM_LONG_ONLY:-true}
      - ORGANISM_RETRAIN_INTERVAL=${ORGANISM_RETRAIN_INTERVAL:-600}
      - ORGANISM_FREEZE_ADAPTATION=${ORGANISM_FREEZE_ADAPTATION:-1}
      - ORGANISM_USE_STREAMING=${ORGANISM_USE_STREAMING:-0}
      - ORGANISM_TRAIN_WINDOW=${ORGANISM_TRAIN_WINDOW:-100}
      - ORGANISM_DRAWDOWN_COOLDOWN_S=${ORGANISM_DRAWDOWN_COOLDOWN_S:-3600}
      # Fallback aligned with DEFAULT_DRAWDOWN_KILL_PCT in backend/organism/governance.py
      - ORGANISM_DRAWDOWN_KILL_PCT=${ORGANISM_DRAWDOWN_KILL_PCT:-0.05}
      - ORGANISM_MAX_CHANGES_PER_DAY=${ORGANISM_MAX_CHANGES_PER_DAY:-500}
      - ORGANISM_ML_DECAY_RATE=${ORGANISM_ML_DECAY_RATE:-0.005}
      - ORGANISM_MAX_PER_SECTOR=${ORGANISM_MAX_PER_SECTOR:-4}

      # Redis Configuration
      - REDIS_URL=redis://:${REDIS_PASSWORD:-changeme_redis}@redis:6379/0

      # Container-specific
      - PYTHONPATH=/app
      - PYTHONUNBUFFERED=1
      - PYTHONDONTWRITEBYTECODE=1

    volumes:
      - ./logs:/app/logs
      - ./data:/app/data
      - ./organism_brain:/app/organism_brain
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    restart: unless-stopped
    networks:
      - trading-network

  # PostgreSQL Database
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-algotrading}
      POSTGRES_USER: ${POSTGRES_USER:-trading}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8 --lc-collate=C --lc-ctype=C"
    command:
      - "postgres"
      - "-c"
      - "shared_buffers=256MB"
      - "-c"
      - "work_mem=16MB"
      - "-c"
      - "maintenance_work_mem=128MB"
      - "-c"
      - "effective_cache_size=768MB"
      - "-c"
      - "checkpoint_completion_target=0.9"
      - "-c"
      - "log_min_duration_statement=500"
      - "-c"
      - "statement_timeout=30000"
      - "-c"
      - "idle_in_transaction_session_timeout=60000"
    ports:
      - "127.0.0.1:5432:5432"  # Bind to localhost only for security
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/db:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trading -d algotrading"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - trading-network

  # Redis for Caching/Sessions
  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6379:6379"
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru --requirepass ${REDIS_PASSWORD:-changeme_redis}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-changeme_redis}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped
    networks:
      - trading-network

  # OpenTelemetry Collector (Optional)
  otel-collector:
    image: otel/opentelemetry-collector-contrib:latest
    command: ["--config=/etc/otel-collector-config.yaml"]
    volumes:
      - ./config/otel-collector-config.yaml:/etc/otel-collector-config.yaml
    ports:
      - "4317:4317"   # OTLP gRPC receiver
      - "4318:4318"   # OTLP HTTP receiver
      - "8889:8889"   # Prometheus metrics exporter
    depends_on:
      - prometheus
    restart: unless-stopped
    networks:
      - trading-network
    profiles:
      - observability

  # Prometheus for Metrics (Optional)
  prometheus:
    image: prom/prometheus:latest
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--storage.tsdb.retention.time=200h'
      - '--web.enable-lifecycle'
    ports:
      - "9090:9090"
    volumes:
      - ./config/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    restart: unless-stopped
    networks:
      - trading-network
    profiles:
      - observability

  # Grafana for Visualization (Optional)
  grafana:
    image: grafana/grafana:latest
    ports:
      - "3000:3000"
    environment:
      # SECURITY FIX (H-10): Password must be set via environment variable
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:?GRAFANA_ADMIN_PASSWORD must be set}
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana_data:/var/lib/grafana
      - ./config/grafana/provisioning:/etc/grafana/provisioning
    depends_on:
      - prometheus
    restart: unless-stopped
    networks:
      - trading-network
    profiles:
      - observability

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  prometheus_data:
    driver: local
  grafana_data:
    driver: local

networks:
  trading-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16

# Health check verification script
# Run: docker-compose exec api curl -f http://localhost:8000/readyz
# Or: docker-compose ps (check healthy status)
