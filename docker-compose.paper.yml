# Paper Trading Deployment Configuration
# Uses real Alpaca Paper Trading API with working credentials
version: '3.8'

services:
  # Main API Service - Paper Trading Configuration
  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    ports:
      - "8000:8000"
    environment:
      # Application Settings - PAPER TRADING
      - APP_ENVIRONMENT=paper
      - APP_LOG_LEVEL=INFO
      - DEBUG=false

      # Database Configuration - Paper Trading DB
      - DATABASE_URL=postgresql+asyncpg://trading_user:trading_password_secure_2024@postgres:5432/trading_platform
      - DATABASE_POOL_SIZE=20
      - DATABASE_MAX_OVERFLOW=30
      - DATABASE_ECHO=false

      # Alpaca Configuration - PAPER TRADING (WORKING CREDENTIALS)
      - ALPACA_API_KEY_ID=PK6HHOLVI6KJ2DTESPKR
      - ALPACA_API_SECRET_KEY=vpuCh1GHrr6NBjIecJdc8dGQRa0f302vSmD8kM7W
      - ALPACA_BASE_URL=https://paper-api.alpaca.markets
      - ALPACA_DATA_URL=https://data.alpaca.markets/v2
      - ALPACA_STREAM_URL=wss://paper-api.alpaca.markets/stream
      - ALPACA_PAPER=true

      # Security Settings - PRODUCTION SECURE JWT
      - JWT_SECRET_KEY=-su+!LL(*t2ej3Dk5LXyVwjRPctWyRDN#cYnJP3NwYniGVSiS9(!tL+4(9w_+^%D
      - JWT_ALGORITHM=HS256
      - JWT_EXPIRE_MINUTES=60

      # Trading Settings
      - USE_MOCK_DATA=false
      - USE_MOCK_BROKER=false

      # Observability Settings
      - OTEL_SERVICE_NAME=algotrading-api-paper
      - OTEL_SERVICE_VERSION=1.0.0
      - OTEL_ENABLED=true
      - PROMETHEUS_ENABLED=true
      - PROMETHEUS_PATH=/metrics

      # Performance Settings
      - PYTHONPATH=/app
      - PYTHONUNBUFFERED=1
      - PYTHONDONTWRITEBYTECODE=1

    volumes:
      - ./logs:/app/logs
      - ./data:/app/data
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    restart: unless-stopped
    networks:
      - trading-network

  # Redis for Paper Trading Caching
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru --save 900 1
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - trading-network

  postgres:
    image: postgres:16-alpine
    container_name: trading_platform_db_paper
    environment:
      POSTGRES_DB: trading_platform
      POSTGRES_USER: trading_user
      POSTGRES_PASSWORD: trading_password_secure_2024
      POSTGRES_HOST_AUTH_METHOD: md5
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    command: >
      postgres
      -c shared_preload_libraries=pg_stat_statements
      -c pg_stat_statements.track=all
      -c max_connections=200
      -c shared_buffers=256MB
      -c effective_cache_size=1GB
      -c maintenance_work_mem=64MB
      -c checkpoint_completion_target=0.7
      -c wal_buffers=16MB
      -c default_statistics_target=100
      -c random_page_cost=1.1
      -c effective_io_concurrency=200
      -c work_mem=4MB
      -c min_wal_size=1GB
      -c max_wal_size=4GB
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trading_user -d trading_platform"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - trading-network

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  trading-network:
    driver: bridge