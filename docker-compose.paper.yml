# Paper Trading Deployment Configuration
# Uses real Alpaca Paper Trading API with working credentials
services:
  # Main API Service - Paper Trading Configuration
  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
      # V12 W82 (post-audit cleanup): pass build provenance so
      # /api/v1/health/deploy returns useful values.  Set in your
      # shell before ``docker-compose build``:
      #   export VCS_REF=$(git rev-parse HEAD)
      #   export BUILD_DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ)
      # …or use the ``scripts/deploy/rebuild_paper.sh`` helper.
      args:
        VCS_REF: ${VCS_REF:-unknown}
        BUILD_DATE: ${BUILD_DATE:-unknown}
        VERSION: ${VERSION:-1.0.0}
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      # Application Settings - PAPER TRADING
      - APP_ENVIRONMENT=development
      # Audit-L finding L-8 (2026-05-02): APP_LOG_LEVEL was a phantom
      # — code reads LOG_LEVEL (per backend/config/base_settings.py:937).
      # Use the canonical name; keep APP_LOG_LEVEL for any consumer
      # explicitly looking for it.
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - APP_LOG_LEVEL=${LOG_LEVEL:-INFO}
      - DEBUG=false

      # CORS (frontend origins)
      # Note: pydantic-settings treats list fields as JSON in env vars.
      - APP_CORS_ORIGINS=${APP_CORS_ORIGINS:-["http://localhost:3000","http://127.0.0.1:3000","http://localhost:5173","http://127.0.0.1:5173"]}
      - CORS_ORIGINS=${CORS_ORIGINS:-["http://localhost:3000","http://127.0.0.1:3000","http://localhost:5173","http://127.0.0.1:5173"]}

      # Database Configuration - Paper Trading DB
      # SECURITY FIX (H-10): Passwords must be set via environment variables
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-trading_user}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/${POSTGRES_DB:-trading_platform}
      - DATABASE_POOL_SIZE=20
      - DATABASE_MAX_OVERFLOW=30
      - DATABASE_ECHO=false

      # Alpaca Configuration - PAPER TRADING (WORKING CREDENTIALS)
      # NOTE: Set credentials via .env / env file; do not hardcode keys in compose.
      - ALPACA_API_KEY_ID=${ALPACA_API_KEY_ID}
      - ALPACA_API_SECRET_KEY=${ALPACA_API_SECRET_KEY}
      - ALPACA_BASE_URL=https://paper-api.alpaca.markets
      - ALPACA_DATA_URL=https://data.alpaca.markets/v2
      - ALPACA_STREAM_URL=wss://paper-api.alpaca.markets/stream
      - ALPACA_PAPER=true

      # V11 CCC-2 / Wave-68 (2026-05-03): explicit risk-cap wiring.
      # Pre-V11 paper compose did NOT wire these — code defaults are
      # 0.05 / 0 / 0 (max_daily_loss + max_notional DISABLED), and a
      # missing .env silently allowed unbounded loss windows.  Now:
      # paper has explicit fallbacks matching the conservative
      # paper-trading risk profile (kill at 5% drawdown; 5500 daily
      # max-loss; 2000 max single-position notional).
      - ORGANISM_DRAWDOWN_KILL_PCT=${ORGANISM_DRAWDOWN_KILL_PCT:-0.05}
      - ORGANISM_DRAWDOWN_COOLDOWN_S=${ORGANISM_DRAWDOWN_COOLDOWN_S:-300}
      - ORGANISM_MAX_DAILY_LOSS=${ORGANISM_MAX_DAILY_LOSS:-5500}
      - ORGANISM_MAX_NOTIONAL=${ORGANISM_MAX_NOTIONAL:-2000}

      # Security Settings - PRODUCTION SECURE JWT
      - JWT_SECRET_KEY=${JWT_SECRET_KEY}
      - SECURITY_JWT_SECRET=${JWT_SECRET_KEY}
      - JWT_ALGORITHM=HS256
      - JWT_EXPIRE_MINUTES=60

      # Trading Settings
      - USE_MOCK_DATA=false
      - USE_MOCK_BROKER=false
      # Phase 5 shadow evidence loop: disabled by default and
      # telemetry-only when enabled. This lets operators turn on candidate
      # filter shadow capture for paper sessions without editing .env.
      - ORGANISM_CANDIDATE_FILTER_SHADOW_TELEMETRY_ENABLED=${ORGANISM_CANDIDATE_FILTER_SHADOW_TELEMETRY_ENABLED:-false}
      - ORGANISM_CANDIDATE_FILTER_SHADOW_TELEMETRY_PATH=${ORGANISM_CANDIDATE_FILTER_SHADOW_TELEMETRY_PATH:-organism_brain/candidate_filter_shadow_telemetry.jsonl}
      # Phase 6 strategy evidence warehouse feed: records every surviving
      # pre-sizing candidate for post-close research. Shadow/advisory only.
      - ORGANISM_STRATEGY_EVIDENCE_TELEMETRY_ENABLED=${ORGANISM_STRATEGY_EVIDENCE_TELEMETRY_ENABLED:-false}
      - ORGANISM_STRATEGY_EVIDENCE_TELEMETRY_PATH=${ORGANISM_STRATEGY_EVIDENCE_TELEMETRY_PATH:-organism_brain/strategy_evidence_events.jsonl}
      # Phase 9 strategy-engine shadow capture: emits CandidateSignal evidence
      # only. It never touches ranking, sizing, gates, orders, or promotion.
      - ORGANISM_PHASE9_SHADOW_ENGINES_ENABLED=${ORGANISM_PHASE9_SHADOW_ENGINES_ENABLED:-false}
      # Task S log-only retracement shadow exit: logs what retracement_f60_m10
      # would do vs the real exit, per closed position. Zero effect on trading.
      # Off unless ORGANISM_SHADOW_EXIT_POLICY=retracement is set in .env.
      - ORGANISM_SHADOW_EXIT_POLICY=${ORGANISM_SHADOW_EXIT_POLICY:-}
      - ORGANISM_SHADOW_EXIT_RETRACE_FRAC=${ORGANISM_SHADOW_EXIT_RETRACE_FRAC:-0.6}
      - ORGANISM_SHADOW_EXIT_MIN_FAVORABLE_R=${ORGANISM_SHADOW_EXIT_MIN_FAVORABLE_R:-1.0}
      - ORGANISM_SHADOW_EXIT_TELEMETRY_PATH=${ORGANISM_SHADOW_EXIT_TELEMETRY_PATH:-organism_brain/shadow_exit_telemetry.jsonl}

      # Observability Settings
      - OTEL_SERVICE_NAME=algotrading-api-paper
      - OTEL_SERVICE_VERSION=1.0.0
      - OTEL_ENABLED=true
      - PROMETHEUS_ENABLED=true
      - PROMETHEUS_PATH=/metrics

      # Performance Settings
      - PYTHONPATH=/app
      - PYTHONUNBUFFERED=1
      - PYTHONDONTWRITEBYTECODE=1

      # Redis Configuration
      - REDIS_URL=redis://:${REDIS_PASSWORD:-changeme_redis}@redis:6379/0

    volumes:
      - ./logs:/app/logs
      - ./data:/app/data
      - ./organism_brain:/app/organism_brain
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    restart: unless-stopped
    # V4 P-P1 (2026-05-02): match production.yml's log rotation. The
    # paper compose previously had no `logging` block, so docker's
    # default `json-file` driver buffered logs unboundedly — host has
    # multiple 50MB rotated files plus a stale 126MB `app.log` from
    # February. 100MB × 5 file ceiling matches production.
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "5"
    # V7 AA-H-4 / Wave-24 (2026-05-03): container hardening.
    # - cap_drop ALL + cap_add only required: minimum kernel surface.
    # - security_opt no-new-privileges: blocks setuid escalation.
    # - mem_limit + cpus: bound resource consumption (V7 EE-7 also).
    # - user 10001:10001: drop the gid=0 root group membership the
    #   audit found (uid was already 10001 but gid stayed 0).
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - SETUID
      - SETGID
    security_opt:
      - no-new-privileges:true
    mem_limit: 4g
    cpus: 2.0
    user: "10001:10001"
    networks:
      - trading-network

  # Redis for Paper Trading Caching
  redis:
    image: redis:7-alpine
    ports:
      # V12 W89 (post-cleanup, COMP-409): bind host port to 127.0.0.1
      # only.  Pre-W89 the publish was ``"6379:6379"`` (host 0.0.0.0),
      # exposing Redis on all host interfaces.  Even with auth, that's
      # not appropriate for paper-trading on a dev machine.  Container
      # internal --bind stays 0.0.0.0 (V7 EE-3 / Wave-23e: required for
      # cross-container traffic on the docker-compose network).
      - "127.0.0.1:6379:6379"
    # V7 EE-3 / Wave-23e (2026-05-03): bind 0.0.0.0 (was 127.0.0.1).
    # 127.0.0.1 inside a container's network namespace refused all
    # cross-container traffic, leaving the broker SLI permanently red.
    # docker-compose's user-defined network is the security boundary;
    # the container is not reachable from the host without explicit
    # port mapping (we don't publish 6379), so 0.0.0.0 + auth is safe.
    command: redis-server --bind 0.0.0.0 --requirepass ${REDIS_PASSWORD:-changeme_redis} --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru --save 900 1
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-changeme_redis}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    # V7 EE-7 / Wave-24 (2026-05-03): match api log rotation so a runaway
    # redis log doesn't fill the host disk.
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"
    networks:
      - trading-network

  postgres:
    image: postgres:16-alpine
    container_name: trading_platform_db_paper
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-trading_platform}
      POSTGRES_USER: ${POSTGRES_USER:-trading_user}
      # SECURITY FIX (H-10): Password must be set via environment variable
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD environment variable is required}
      POSTGRES_HOST_AUTH_METHOD: md5
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    command: >
      postgres
      -c shared_preload_libraries=pg_stat_statements
      -c pg_stat_statements.track=all
      -c max_connections=200
      -c shared_buffers=256MB
      -c effective_cache_size=1GB
      -c maintenance_work_mem=64MB
      -c checkpoint_completion_target=0.7
      -c wal_buffers=16MB
      -c default_statistics_target=100
      -c random_page_cost=1.1
      -c effective_io_concurrency=200
      -c work_mem=4MB
      -c min_wal_size=1GB
      -c max_wal_size=4GB
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trading_user -d trading_platform"]
      interval: 10s
      timeout: 5s
      retries: 5
    # V7 EE-7 / Wave-24 (2026-05-03): postgres log rotation.
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"
    networks:
      - trading-network

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  trading-network:
    driver: bridge
